services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: soliditpro
      POSTGRES_USER: soliditpro
      POSTGRES_PASSWORD: soliditpro
    ports: ["5432:5432"]
    volumes: [soliditpro_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  soliditpro_pg:
